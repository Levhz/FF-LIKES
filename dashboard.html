<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FF Like API — Panel</title>
<style>
  :root{--bg:#0b0d12;--card:#141821;--line:#232a36;--txt:#e6ebf5;--dim:#8b95a7;
        --ok:#22c55e;--bad:#ef4444;--acc:#00c2ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.5 ui-sans-serif,system-ui,Segoe UI,Roboto}
  .wrap{max-width:980px;margin:0 auto;padding:24px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--dim);margin-bottom:20px;font-size:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:16px;margin-bottom:14px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .grow{flex:1}
  input,button{font:inherit;border-radius:9px;border:1px solid var(--line);
        background:#0e1218;color:var(--txt);padding:9px 11px}
  button{cursor:pointer;background:#1b2230}
  button.p{background:var(--acc);color:#04121a;border:0;font-weight:600}
  button.d{background:#2a1a1c;border-color:#4b2429;color:#ffb4b4}
  .k{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .v{font-size:22px;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .pill{padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700}
  .on{background:#0f2e1c;color:#5ee89b}.off{background:#331418;color:#ff8b8b}
  table{width:100%;border-collapse:collapse;font-size:12px}
  td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left;color:var(--dim)}
  th{color:var(--txt);font-size:11px;text-transform:uppercase}
  .hide{display:none}
  .sw{width:52px;height:28px;border-radius:99px;background:#333c4c;position:relative;
      cursor:pointer;transition:.2s;border:0;padding:0}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;
      border-radius:50%;background:#fff;transition:.2s}
  .sw.on{background:var(--ok)}.sw.on::after{left:27px}
  .toast{position:fixed;bottom:18px;right:18px;background:#1b2230;border:1px solid var(--line);
      padding:10px 14px;border-radius:10px;opacity:0;transition:.25s}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">

  <div id="login">
    <h1>FF Like API</h1>
    <div class="sub">Admin panel</div>
    <div class="card row">
      <input id="pw" type="password" class="grow" placeholder="Admin password">
      <button class="p" onclick="login()">Login</button>
    </div>
  </div>

  <div id="panel" class="hide">
    <div class="row" style="margin-bottom:16px">
      <h1 class="grow" style="margin:0">Dashboard</h1>
      <button class="d" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <div class="row">
        <div class="grow">
          <div class="k">Like API</div>
          <div class="row" style="gap:8px">
            <span id="statePill" class="pill off">OFF</span>
            <button id="sw" class="sw" onclick="toggle()"></button>
          </div>
        </div>
      </div>
      <div class="row" style="margin-top:12px">
        <input id="maint" class="grow" placeholder="Maintenance message (OFF par dikhega)">
        <button onclick="saveMaint()">Save</button>
      </div>
    </div>

    <div class="card grid">
      <div><div class="k">Users</div><div class="v" id="sUsers">0</div></div>
      <div><div class="k">Total likes</div><div class="v" id="sLikes">0</div></div>
      <div><div class="k">Today likes</div><div class="v" id="sToday">0</div></div>
      <div><div class="k">Ready accounts</div><div class="v" id="sReady">0</div></div>
      <div><div class="k">Dead accounts</div><div class="v" id="sDead">0</div></div>
    </div>

    <div class="card">
      <div class="k" style="margin-bottom:8px">Pricing & limits</div>
      <div class="row">
        <input id="cCmd" type="number" placeholder="credits / cmd" style="width:150px">
        <input id="cLike" type="number" placeholder="credits / extra like" style="width:170px">
        <input id="dLimit" type="number" placeholder="daily limit" style="width:130px">
        <input id="mAmt" type="number" placeholder="max per cmd" style="width:140px">
        <button class="p" onclick="saveCfg()">Save</button>
      </div>
    </div>

    <div class="card">
      <div class="k" style="margin-bottom:8px">Credits</div>
      <div class="row">
        <input id="cid" placeholder="Discord ID" class="grow">
        <input id="cdelta" type="number" placeholder="+/- amount" style="width:150px">
        <button class="p" onclick="grant()">Apply</button>
      </div>
    </div>

    <div class="card">
      <div class="k" style="margin-bottom:8px">Pool</div>
      <div class="row">
        <input id="rfill" type="number" value="5" style="width:90px">
        <button onclick="refill()">Generate</button>
        <button class="d" onclick="purge()">Purge dead</button>
      </div>
    </div>

    <div class="card">
      <div class="k" style="margin-bottom:8px">Accounts</div>
      <table><thead><tr><th>UID</th><th>Region</th><th>Status</th>
        <th>Likes today</th><th>Fails</th></tr></thead>
        <tbody id="gBody"></tbody></table>
    </div>

    <div class="card">
      <div class="k" style="margin-bottom:8px">Recent logs</div>
      <table><thead><tr><th>User</th><th>Target</th><th>Likes</th>
        <th>OK</th><th>When</th></tr></thead>
        <tbody id="lBody"></tbody></table>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
const $ = id => document.getElementById(id);
let token = localStorage.getItem("tok") || "";

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1800);}

async function api(path, method="GET", body){
  const r = await fetch(path, {method, headers:{
    "Authorization":"Bearer "+token, "Content-Type":"application/json"},
    body: body?JSON.stringify(body):undefined});
  if(r.status===401){logout();throw new Error("unauthorized");}
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

async function login(){
  const r = await fetch("/admin/login",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({password:$("pw").value})});
  if(!r.ok) return toast("Wrong password");
  token = (await r.json()).token;
  localStorage.setItem("tok", token);
  start();
}
function logout(){localStorage.removeItem("tok");token="";
  $("panel").classList.add("hide");$("login").classList.remove("hide");}

async function load(){
  try{
    const d = await api("/admin/overview");
    const on = d.settings.api_enabled;
    $("sw").classList.toggle("on", on);
    $("statePill").textContent = on?"ON":"OFF";
    $("statePill").className = "pill "+(on?"on":"off");
    $("maint").value = d.settings.maintenance_msg || "";
    $("cCmd").value = d.settings.cost_per_cmd;
    $("cLike").value = d.settings.cost_per_like;
    $("dLimit").value = d.settings.daily_limit;
    $("mAmt").value = d.settings.max_amount;
    $("sUsers").textContent = d.stats.users;
    $("sLikes").textContent = d.stats.total_likes;
    $("sToday").textContent = d.stats.today_likes;
    $("sReady").textContent = d.pool.ready || 0;
    $("sDead").textContent = d.pool.dead || 0;
    $("gBody").innerHTML = d.guests.map(g=>`<tr><td>${g.uid}</td><td>${g.region}</td>
      <td>${g.status}</td><td>${g.likes_today}</td><td>${g.fails}</td></tr>`).join("");
    $("lBody").innerHTML = d.logs.map(l=>`<tr><td>${l.user_id}</td><td>${l.target}</td>
      <td>${l.amount}</td><td>${l.ok?"✅":"❌"}</td><td>${l.created}</td></tr>`).join("");
  }catch(e){ if(token) toast(e.message); }
}

async function toggle(){
  const on = !$("sw").classList.contains("on");
  await api("/admin/settings","POST",{api_enabled:on});
  toast(on?"API ON":"API OFF"); load();
}
async function saveMaint(){
  await api("/admin/settings","POST",{maintenance_msg:$("maint").value});
  toast("Saved");
}
async function saveCfg(){
  await api("/admin/settings","POST",{
    cost_per_cmd:+$("cCmd").value, cost_per_like:+$("cLike").value,
    daily_limit:+$("dLimit").value, max_amount:+$("mAmt").value});
  toast("Config saved"); load();
}
async function grant(){
  const id = $("cid").value.trim();
  if(!id) return toast("ID daal");
  const r = await api("/admin/credits","POST",
    {discord_id:+id, delta:+$("cdelta").value});
  toast("Balance: "+r.credits); load();
}
async function refill(){
  await api("/admin/pool/refill","POST",{count:+$("rfill").value});
  toast("Generating..."); setTimeout(load, 4000);
}
async function purge(){
  const r = await api("/admin/pool/purge","POST");
  toast("Removed "+r.removed); load();
}

function start(){
  $("login").classList.add("hide");
  $("panel").classList.remove("hide");
  load(); setInterval(load, 8000);
}
if(token) start();
$("pw").addEventListener("keydown", e=>{if(e.key==="Enter") login();});
</script>
</body>
</html>
